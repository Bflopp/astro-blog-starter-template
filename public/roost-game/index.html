<title>ROOST — Dirt Bike Trivia</title>
<meta name="description" content="ROOST is a dirt-bike themed rarity trivia game. Seven timed prompts, obscure answers ride farther.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #160f16;
    color: #f5e9d0;
    font-family: "Courier New", Courier, monospace;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  /* Fixed pixel-art background */
  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    z-index: 0;
  }
  #shade {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,7,18,.66) 0%, rgba(10,7,18,.55) 45%, rgba(10,7,18,.78) 100%);
  }
  /* Slim vertical trail gauge */
  #gauge {
    position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 62vh; min-height: 280px; z-index: 2;
    background: #100c1c; border: 2px solid #000;
    box-shadow: 3px 3px 0 rgba(0,0,0,.5);
  }
  #gauge .band { position: absolute; left: 0; width: 100%; }
  #gauge .tick {
    position: absolute; left: 0; width: 100%; height: 2px; background: #fff; opacity: .9;
  }
  #gauge .tick span {
    display: none;
    position: absolute; right: 34px; top: -7px; white-space: nowrap;
    font-size: 10px; color: #ffe9c4; background: rgba(10,7,18,.85);
    padding: 2px 5px; border: 1px solid #000;
  }
  #gauge .rider-dot {
    position: absolute; left: -4px; width: 36px; height: 10px;
    background: #ffb347; border: 2px solid #000; z-index: 3;
  }
  @media (min-width: 760px) { #gauge .tick span { display: block; } }
  /* Centered quiz column */
  #app {
    position: relative; z-index: 3;
    max-width: 680px; margin: 0 auto;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 24px 18px 64px;
  }
  .panel {
    background: rgba(17,13,30,.95);
    border: 3px solid #4a3620;
    box-shadow: 0 0 0 3px #0b0812, 0 10px 34px rgba(0,0,0,.65);
    border-radius: 4px;
    padding: 30px 26px;
  }
  h1.game-title {
    font-size: 64px; letter-spacing: 10px; text-align: center;
    color: #ffb347; text-shadow: 4px 4px 0 #7a2d00, 8px 8px 0 rgba(0,0,0,.55);
    margin-bottom: 4px;
  }
  .tagline { text-align: center; color: #e8d5ae; font-size: 16px; margin-bottom: 20px; letter-spacing: 1px; }
  h2.screen-title {
    font-size: 26px; letter-spacing: 3px; color: #ffb347;
    text-shadow: 2px 2px 0 #000; margin-bottom: 14px; text-align: center;
  }
  .howto {
    font-size: 14px; line-height: 1.75; color: #d9c9a3;
    background: rgba(0,0,0,.28); border: 2px solid #000;
    padding: 14px 16px; margin: 0 0 20px;
  }
  .howto b { color: #ffb347; }
  .btn {
    display: block; width: 100%;
    font-family: inherit; font-size: 19px; font-weight: bold; letter-spacing: 2px;
    text-transform: uppercase;
    color: #221204; background: #ffb347; border: 0;
    padding: 16px 12px; margin: 10px 0; cursor: pointer;
    box-shadow: 0 5px 0 #9c5510, 0 9px 0 rgba(0,0,0,.45);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9c5510; }
  .btn.secondary { background: #8a6f4d; color: #fff4dd; box-shadow: 0 5px 0 #4d3a22, 0 9px 0 rgba(0,0,0,.45); }
  .btn.secondary:active { box-shadow: 0 1px 0 #4d3a22; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { margin: 10px 0 0; }
  .checkpoint-label { text-align: center; font-size: 14px; letter-spacing: 3px; color: #cbb27f; margin-bottom: 6px; }
  .prompt { font-size: 30px; text-align: center; color: #fff4dd; text-shadow: 3px 3px 0 #000; margin: 6px 0 4px; line-height: 1.25; }
  .dist-readout { text-align: center; font-size: 15px; color: #ffb347; letter-spacing: 1px; margin: 8px 0 2px; }
  .segs { display: flex; gap: 6px; margin: 14px 0 4px; }
  .seg { flex: 1; height: 14px; background: #241a30; border: 2px solid #000; }
  .seg.done { background: #ffb347; }
  .seg.now { background: #ff3b30; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .timer { height: 20px; background: #241a30; border: 2px solid #000; margin: 14px 0; }
  .timer > div { height: 100%; width: 100%; background: #8ee06a; transition: width .12s linear; }
  .timer.low > div { background: #ff3b30; }
  .timer-num { text-align: center; font-size: 22px; font-weight: bold; color: #fff4dd; text-shadow: 2px 2px 0 #000; }
  .timer.low .timer-num, .timer-num.low { color: #ff5b4d; }
  input[type=text] {
    width: 100%; font-family: inherit; font-size: 22px;
    padding: 15px 14px; margin: 12px 0;
    background: #0d0a17; color: #ffe9c4;
    border: 3px solid #ffb347; border-radius: 0;
  }

  .reveal-answer { font-size: 24px; text-align: center; margin: 10px 0; color: #fff4dd; text-shadow: 2px 2px 0 #000; word-break: break-word; }
  .verdict {
    text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 2px;
    padding: 10px; margin: 12px 0; border: 3px solid #000;
  }
  .verdict.good { background: #2f6b2f; color: #eaffea; }
  .verdict.bad { background: #6b2f2f; color: #ffeaea; }
  .tier-line { text-align: center; font-size: 17px; color: #ffb347; margin: 8px 0; letter-spacing: 1px; }
  .pts-line { text-align: center; font-size: 40px; font-weight: bold; color: #fff4dd; text-shadow: 3px 3px 0 #000; margin: 4px 0 8px; }

    text-align: center; font-size: 13px; color: #cfe3ff;
    background: rgba(40,60,120,.35); border: 2px dashed #7d9bd1;
    padding: 8px; margin: 10px 0;

    padding: 9px 12px; font-size: 13px; border-bottom: 2px solid #000;
    background: rgba(0,0,0,.25); color: #e8d5ae;
  }

    font-family: inherit; font-size: 13px; font-weight: bold; letter-spacing: 1px;

<script>
"use strict";
/* ================= Utilities ================= */
function $(id){ return document.getElementById(id); }

function normalize(s){
  return s.toLowerCase().trim()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ").trim()
    .replace(/^the /, "").trim();
}

/* Damerau-Levenshtein (optimal string alignment) */
function damerau(a, b){
  var al = a.length, bl = b.length, i, j, cost;
  var d = [];
  for (i = 0; i <= al; i++){ d[i] = []; d[i][0] = i; }
  for (j = 0; j <= bl; j++){ d[0][j] = j; }
  for (i = 1; i <= al; i++){
    for (j = 1; j <= bl; j++){
      cost = (a.charAt(i-1) === b.charAt(j-1)) ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + cost);
      if (i > 1 && j > 1 && a.charAt(i-1) === b.charAt(j-2) && a.charAt(i-2) === b.charAt(j-1)){
        d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
      }
    }
  }
  return d[al][bl];
}

function hashStr(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function localDateStr(){
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function fmt(n){ return n.toLocaleString("en-US"); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function hashN(n){ var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function lerp(a, b, t){ return a + (b - a) * t; }
function lerpC(c1, c2, t){
  return [Math.round(lerp(c1[0],c2[0],t)), Math.round(lerp(c1[1],c2[1],t)), Math.round(lerp(c1[2],c2[2],t))];
}
function css(c){ return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }

/* ================= Audio (WebAudio, no files) ================= */
var AC = null;
function audioCtx(){
  if (!AC){ var Ctor = window.AudioContext || window.webkitAudioContext; if (Ctor) AC = new Ctor(); }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, when, slideTo){
  if (S.muted) return;
  var ctx = audioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime + (when || 0);
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sndTick(){ tone(880, 0.06, "square", 0.10); }
function sndChime(){ tone(660, 0.14, "sine", 0.16); tone(990, 0.22, "sine", 0.16, 0.11); }
function sndThud(){ tone(95, 0.28, "sine", 0.22, 0, 45); }
function sndRev(){
  if (S.muted) return;
  var ctx = audioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(70, t0);
  o.frequency.exponentialRampToValueAtTime(420, t0 + 1.15);
  f.type = "lowpass"; f.frequency.setValueAtTime(900, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
  o.connect(f); f.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + 1.4);
}
</script>

/* Pre-build lookup maps: normalized string -> {pts, canon} */
CATEGORIES.forEach(function(cat){
  var map = {};
  cat.answers.forEach(function(entry){
    var canon = entry[0], pts = entry[1], aliases = entry[2] || [];
    var keys = [canon].concat(aliases);
    keys.forEach(function(k){
      var nk = normalize(k);
      if (!(nk in map)) map[nk] = {pts: pts, canon: canon};
    });
  });
  cat.map = map;
  cat.keys = Object.keys(map);
});

/* ================= Answer checking ================= */
function checkAnswer(raw, cat){
  var n = normalize(raw);
  if (!n) return {ok:false, pts:0, tier:"Stalled Out", fuzzy:null};
  var hit = cat.map[n];
  if (hit) return {ok:true, pts:hit.pts, tier:tierFor(hit.pts), fuzzy:null};
  /* plural fallback */
  var stem = null;
  if (/ies$/.test(n)) stem = n.slice(0,-3) + "y";
  else if (/s$/.test(n) && !/ss$/.test(n)) stem = n.slice(0,-1);
  if (stem && cat.map[stem]) return {ok:true, pts:cat.map[stem].pts, tier:tierFor(cat.map[stem].pts), fuzzy:null};
  /* spell-check fuzzy match */
  if (n.length >= 4){
    var best = null, bestD = 99;
    for (var i = 0; i < cat.keys.length; i++){
      var k = cat.keys[i];
      if (k.charAt(0) !== n.charAt(0)) continue;
      var maxD = (k.length <= 8) ? 1 : 2;
      var d = damerau(n, k);
      if (d <= maxD && d < bestD){ bestD = d; best = k; }
    }
    if (best){
      var rec = cat.map[best];
      return {ok:true, pts:rec.pts, tier:tierFor(rec.pts), fuzzy:{read: raw.trim(), as: rec.canon}};
    }
  }
  return {ok:false, pts:0, tier:"Stalled Out", fuzzy:null};
}

function tierFor(p){
  if (p <= 10) return "Training Wheels";
  if (p <= 25) return "Pit Crew";
  if (p <= 40) return "Trail Rider";
  if (p <= 60) return "Moto Head";
  if (p <= 85) return "Pro Circuit";
  return "Factory Legend";
}
var ZONES = [
  {max:200, name:"Practice Track", color:"#7ec850"},
  {max:1000, name:"Forest Single-Track", color:"#2e9e6b"},
  {max:4000, name:"Desert Wash", color:"#d9a441"},
  {max:6000, name:"Rocky Climb", color:"#b0623a"},
  {max:7000, name:"Summit Ridge", color:"#9b6bd3"}
];
var MARKERS = [
  {m:0, name:"Start Gate"},
  {m:450, name:"Whoops Section"},
  {m:1200, name:"Rhythm Section"},
  {m:3000, name:"Sand Wash"},
  {m:5000, name:"Rock Garden"},
  {m:7000, name:"Finish Line"}
];
function zoneFor(d){
  for (var i = 0; i < ZONES.length; i++) if (d <= ZONES[i].max) return ZONES[i];
  return ZONES[ZONES.length-1];
}
function rankFor(p){
  if (p < 100) return "Pit Newbie";
  if (p < 250) return "Weekend Warrior";
  if (p < 400) return "Trail Boss";
  if (p < 550) return "Moto Veteran";
  if (p < 650) return "Desert Racer";
  return "Baja Legend";
}

<script>
"use strict";
/* ================= Game state (in-memory only — no storage APIs) ================= */
var S = {
  mode: null, cats: [], round: 0,
  points: 0, targetDist: 0, dispDist: 0,
  breakdown: [],
  dailyDone: false, muted: false,
  best: {daily: 0, unlimited: 0},
  timerId: null, deadline: 0, lastTickSec: -1, submitted: false,
  burst: 0
};
var ROUND_MS = 20000;

function segsHTML(doneCount, current){
  var h = '<div class="segs">';
  for (var i = 0; i < 7; i++){
    var cls = "seg";
    if (i < doneCount) cls += " done";
    else if (i === current) cls += " now";
    h += '<div class="' + cls + '"></div>';
  }
  return h + "</div>";
}
function distReadoutHTML(){
  return '<div class="dist-readout"><span id="distReadout">0 m</span></div>';
}

/* ================= Screens ================= */
function showHome(){
  stopTimer();
  var dailyBtn = S.dailyDone
    ? '<button class="btn secondary" type="button" disabled>Daily Ride (done)</button>'
    : '<button class="btn" type="button" id="dailyBtn">Daily Ride</button>';
  $("app").innerHTML =
    '<div class="panel">' +
    '<h1 class="game-title">ROOST</h1>' +
    '<div class="tagline">How far can your answers take you?</div>' +
    '<div class="howto">' +
    "<b>7 prompts. 20 seconds each.</b><br>" +
    "Every valid answer has a hidden rarity: obvious answers putt along for ~10 pts, " +
    "obscure-but-valid answers pin the throttle up to 100.<br>" +
    "Each point = <b>10 meters of trail</b>. Blank or invalid = stalled at 0.<br>" +
    "Max 700 pts = 7,000 m of trail. Typos get spell-checked.<br>" +
    "Daily Ride: same 7 checkpoints all day, one attempt per visit." +
    "</div>" +
    dailyBtn +
    '<button class="btn secondary" type="button" id="unlBtn">Unlimited Ride</button>' +
    '<div class="bests">Session bests — Daily: <b>' + S.best.daily + '</b> pts &nbsp; Unlimited: <b>' + S.best.unlimited + '</b> pts</div>' +
    '<div class="home-note">Best scores live for this visit only.<br>No account, no tracking.</div>' +
    "</div>";
  if (!S.dailyDone) $("dailyBtn").onclick = function(){ startRide("daily"); };
  $("unlBtn").onclick = function(){ startRide("unlimited"); };
}

function pickDaily(){
  var rng = mulberry32(hashStr("roost-" + localDateStr()));
  var idx = CATEGORIES.map(function(_, i){ return i; });
  for (var i = idx.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1)), t = idx[i];
    idx[i] = idx[j]; idx[j] = t;
  }
  return idx.slice(0, 7).map(function(i){ return CATEGORIES[i]; });
}
function pickUnlimited(){
  var idx = CATEGORIES.map(function(_, i){ return i; });
  for (var i = idx.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = idx[i];
    idx[i] = idx[j]; idx[j] = t;
  }
  return idx.slice(0, 7).map(function(i){ return CATEGORIES[i]; });
}

function startRide(mode){
  audioCtx();
  if (mode === "daily"){
    if (S.dailyDone){ showHome(); return; }
    S.dailyDone = true;
    S.cats = pickDaily();
  } else {
    S.cats = pickUnlimited();
  }
  S.mode = mode; S.round = 0; S.points = 0;
  S.targetDist = 0; S.dispDist = 0;
  S.breakdown = []; S.burst = 0;
  showRound();
}

function showRound(){
  stopTimer();
  var cat = S.cats[S.round];
  $("app").innerHTML =
    '<div class="panel">' +
    '<div class="checkpoint-label">CHECKPOINT ' + (S.round + 1) + ' OF 7</div>' +
    segsHTML(S.round, S.round) +
    '<div class="prompt">' + esc(cat.prompt) + "</div>" +
    distReadoutHTML() +
    '<div class="timer" id="timerWrap"><div id="timerFill"></div></div>' +
    '<div class="timer-num" id="timerNum">20s</div>' +
    '<form id="ansForm" autocomplete="off">' +
    '<input type="text" id="ans" maxlength="80" placeholder="Type your answer..." aria-label="Your answer">' +
    '<button class="btn" type="submit">Send it</button>' +
    "</form>" +
    "</div>";
  $("ansForm").onsubmit = function(e){ e.preventDefault(); submitAnswer(false); };
  var inp = $("ans");
  if (inp) inp.focus();
  startTimer();
}

function startTimer(){
  stopTimer();
  S.deadline = performance.now() + ROUND_MS;
  S.lastTickSec = -1; S.submitted = false;
  S.timerId = setInterval(tickTimer, 100);
  tickTimer();
}
function stopTimer(){
  if (S.timerId){ clearInterval(S.timerId); S.timerId = null; }
}
function tickTimer(){
  var remain = Math.max(0, S.deadline - performance.now());
  var sec = Math.ceil(remain / 1000);
  var fill = $("timerFill"), wrap = $("timerWrap"), num = $("timerNum");
  if (fill) fill.style.width = (remain / ROUND_MS * 100) + "%";
  if (wrap) wrap.classList.toggle("low", remain <= 5000);
  if (num){ num.textContent = sec + "s"; num.classList.toggle("low", remain <= 5000); }
  if (sec !== S.lastTickSec){
    S.lastTickSec = sec;
    if (sec <= 5 && sec > 0) sndTick();
  }
  if (remain <= 0) submitAnswer(true);
}

function submitAnswer(timeout){
  if (S.submitted) return;
  S.submitted = true;
  stopTimer();
  var raw = timeout ? "" : ($("ans") ? $("ans").value : "");
  var cat = S.cats[S.round];
  var res = checkAnswer(raw, cat);
  if (res.ok) sndChime(); else sndThud();
  S.points += res.pts;
  S.targetDist = S.points * 10;
  S.breakdown.push({
    prompt: cat.prompt,
    answer: raw ? raw.trim() : "",
    pts: res.pts, tier: res.tier, ok: res.ok, fuzzy: res.fuzzy
  });
  showReveal(res, raw);
}

function showReveal(res, raw){
  var shown = raw && raw.trim() ? esc(raw.trim()) : "No answer";
  var verdict = res.ok
    ? '<div class="verdict good">ACCEPTED</div>'
    : '<div class="verdict bad">STALLED OUT</div>';
  var spell = "";
  if (res.fuzzy){
    spell = '<div class="spell-note">Spell-checked: read &ldquo;' + esc(res.fuzzy.read) +
      '&rdquo; as &ldquo;' + esc(res.fuzzy.as) + '&rdquo;.</div>';
  }
  var btnLabel = (S.round < 6) ? "Keep riding" : "Finish";
  $("app").innerHTML =
    '<div class="panel">' +
    '<div class="checkpoint-label">CHECKPOINT ' + (S.round + 1) + ' OF 7 COMPLETE</div>' +
    segsHTML(S.round + 1, -1) +
    verdict +
    '<div class="reveal-answer">&ldquo;' + shown + '&rdquo;</div>' +
    spell +
    '<div class="tier-line">' + esc(res.tier) + "</div>" +
    '<div class="pts-line">+' + res.pts + " PTS</div>" +
    distReadoutHTML() +
    '<button class="btn" type="button" id="nextBtn">' + btnLabel + "</button>" +
    "</div>";
  $("nextBtn").onclick = nextStep;
  var nb = $("nextBtn"); if (nb) nb.focus();
}

function nextStep(){
  audioCtx();
  sndRev();
  S.burst = 1;
  if (S.round < 6){ S.round++; showRound(); }
  else { showResults(); }
}

function showResults(){
  stopTimer();
  var dist = S.targetDist;
  var zone = zoneFor(dist), rank = rankFor(S.points);
  if (S.mode === "daily") S.best.daily = Math.max(S.best.daily, S.points);
  else S.best.unlimited = Math.max(S.best.unlimited, S.points);
  var rows = "";
  for (var i = 0; i < S.breakdown.length; i++){
    var b = S.breakdown[i];
    var a = b.answer ? esc(b.answer) : "<i>no answer</i>";
    rows += '<div class="brow"><span>' + (i+1) + ". " + esc(b.prompt) + " — " + a +
      "</span><span class='pts'>+" + b.pts + "</span></div>";
  }
  $("app").innerHTML =
    '<div class="panel">' +
    '<h2 class="screen-title">RIDE COMPLETE</h2>' +
    '<div class="total-big">' + S.points + '<span style="font-size:22px">/700</span></div>' +
    '<div class="total-sub">' + fmt(dist) + ' m of trail — ' + esc(zone.name) + "</div>" +
    '<div class="rank-big">' + esc(rank) + "</div>" +
    '<div class="breakdown">' + rows + "</div>" +
    '<div class="bests">Session bests — Daily: <b>' + S.best.daily + '</b> pts &nbsp; Unlimited: <b>' + S.best.unlimited + '</b> pts</div>' +
    '<div class="btn-row">' +
    '<button class="btn" type="button" id="shareBtn">Share</button>' +
    '<button class="btn secondary" type="button" id="againBtn">Play again</button>' +
    "</div>" +
    "</div>";
  $("shareBtn").onclick = shareScore;
  $("againBtn").onclick = showHome;
}

function shareScore(){
  var btn = $("shareBtn");
  var modeLabel = (S.mode === "daily") ? "Daily Ride" : "Unlimited Ride";
  var text = "I rode " + fmt(S.targetDist) + " m in ROOST (" + modeLabel + ", " + S.points + " pts). Can you go farther?";
  function done(){ if (btn){ btn.textContent = "Copied!"; setTimeout(function(){ btn.textContent = "Share"; }, 1800); } }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
</script>
<script>
"use strict";
/* ================= Pixel-art background + gauge ================= */
(function(){
  var cv = $("bg");
  var W = 192, H = 108, HOR = 66;
  var buf = document.createElement("canvas");
  buf.width = W; buf.height = H;
  var g = buf.getContext("2d");
  var ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  var dust = [];
  var fr = 0, lastT = 0;

  function resize(){
    cv.width = Math.max(2, window.innerWidth);
    cv.height = Math.max(2, window.innerHeight);
  }
  window.addEventListener("resize", resize);
  resize();

  function rect(x, y, w, h, c){ g.fillStyle = c; g.fillRect(x | 0, y | 0, w, h); }

  function buildGauge(){
    var prev = 0, html = "";
    for (var i = 0; i < ZONES.length; i++){
      var z = ZONES[i];
      html += '<div class="band" style="bottom:' + (prev/7000*100) + '%;height:' +
        ((z.max-prev)/7000*100) + '%;background:' + z.color + ';opacity:.85"></div>';
      prev = z.max;
    }
    for (var m = 0; m < MARKERS.length; m++){
      var mk = MARKERS[m];
      html += '<div class="tick" style="bottom:' + (mk.m/7000*100) + '%"><span>' +
        mk.m + ' m — ' + esc(mk.name) + "</span></div>";
    }
    html += '<div class="rider-dot" id="riderDot" style="bottom:0%"></div>';
    $("gauge").innerHTML = html;
  }

  function wheel(ax, ry, ph){
    var tire = "#14100c", hub = "#c9bfa8";
    rect(ax, ry-5, 5, 5, tire);
    rect(ax+2, ry-3, 1, 1, hub);
    if (ph === 0){ rect(ax+2, ry-5, 1, 1, hub); rect(ax+2, ry-1, 1, 1, hub); }
    else if (ph === 1){ rect(ax, ry-3, 1, 1, hub); rect(ax+4, ry-3, 1, 1, hub); }
    else if (ph === 2){ rect(ax+1, ry-4, 1, 1, hub); rect(ax+3, ry-2, 1, 1, hub); }
    else { rect(ax+3, ry-4, 1, 1, hub); rect(ax+1, ry-2, 1, 1, hub); }
  }

  function drawRider(rx, ry){
    var dark = "#1c1410", fc = "#e8641c";
    var jersey = "#2e8fd8", pants = "#23232e", helmet = "#f2ede2";
    var ph = (fr >> 2) % 4;
    wheel(rx, ry, ph);
    wheel(rx+12, ry, (ph+2) % 4);
    rect(rx-1, ry-8, 3, 1, fc);          /* rear fender */
    rect(rx+3, ry-8, 8, 2, fc);          /* frame */
    rect(rx+4, ry-10, 6, 2, fc);         /* tank/seat */
    rect(rx+12, ry-10, 2, 6, dark);      /* fork */
    rect(rx+12, ry-11, 4, 1, dark);      /* handlebar */
    rect(rx+2, ry-6, 6, 1, "#8a8a8a");   /* exhaust */
    rect(rx+6, ry-12, 2, 2, "#ffffff");  /* number plate */
    rect(rx+5, ry-10, 2, 4, pants);      /* legs */
    rect(rx+8, ry-10, 2, 4, pants);
    rect(rx+5, ry-15, 5, 6, jersey);     /* torso */
    rect(rx+9, ry-14, 4, 2, jersey);     /* arm */
    rect(rx+6, ry-19, 4, 4, helmet);     /* helmet */
    rect(rx+9, ry-18, 1, 2, "#223");     /* visor */
  }

  function draw(dt){
    fr++;
    var gap = S.targetDist - S.dispDist;
    if (Math.abs(gap) < 0.5) S.dispDist = S.targetDist;
    else S.dispDist += gap * Math.min(1, dt * 3.4);
    S.burst = Math.max(0, S.burst - dt / 1.5);

    var skyT = Math.min(1, S.dispDist / 7000);
    var scroll = S.dispDist * 0.085;
    var x, y, i;

    /* sky */
    var top = lerpC([255,146,66], [36,16,62], skyT);
    var bot = lerpC([255,208,132], [150,74,118], skyT);
    for (y = 0; y < HOR; y++){
      g.fillStyle = css(lerpC(top, bot, y / HOR));
      g.fillRect(0, y, W, 1);
    }
    /* stars at dusk */
    if (skyT > 0.45){
      g.fillStyle = "#ffffff";
      for (i = 0; i < 46; i++){
        if (hashN(i * 7.31) < (skyT - 0.45) * 1.8){
          g.fillRect((hashN(i * 1.17) * W) | 0, (hashN(i * 3.71) * HOR * 0.72) | 0, 1, 1);
        }
      }
    }
    /* pixel sun */
    var sunC = css(lerpC([255,224,130], [205,62,58], skyT));
    rect(W * 0.64, HOR - 32, 26, 26, sunC);
    rect(W * 0.64 + 4, HOR - 36, 18, 4, sunC);

    /* far mountains */
    var mc = css(lerpC([122,72,82], [30,16,44], skyT));
    for (x = 0; x < W; x += 6){
      var mi = Math.floor((x + scroll * 0.12) / 6);
      var mh = hashN(mi * 1.71) * 30 + 4;
      rect(x, HOR - mh, 6, mh, mc);
    }
    /* dunes */
    var dc = css(lerpC([198,128,74], [54,30,60], skyT));
    for (x = 0; x < W; x += 8){
      var di2 = Math.floor((x + scroll * 0.35) / 8);
      var dh = hashN(di2 * 2.33 + 5) * 12 + 2;
      rect(x, HOR - dh, 8, dh, dc);
    }
    /* ground + track */
    rect(0, HOR, W, H - HOR, css(lerpC([198,142,86], [62,38,64], skyT)));
    rect(0, HOR + 16, W, H - HOR - 16, css(lerpC([152,102,62], [46,28,48], skyT)));
    var ec = css(lerpC([230,180,120], [110,70,90], skyT));
    rect(0, HOR + 16, W, 1, ec);
    rect(0, HOR + 34, W, 1, ec);
    /* scrolling track dashes */
    var dashC = css(lerpC([235,200,140], [120,80,95], skyT));
    var P = 20 * 26;
    for (var k = 0; k < 20; k++){
      var rel = (k * 26 - scroll) % P;
      if (rel < 0) rel += P;
      var sx = rel - 26;
      if (sx > -12 && sx < W + 12) rect(sx, HOR + 25, 8, 1, dashC);
    }
    /* cacti + rocks */
    for (var c = -1; c <= W / 46 + 1; c++){
      var ci = Math.floor(scroll / 46) + c;
      var csx = Math.round(ci * 46 + hashN(ci * 3.37) * 26 - scroll);
      if (csx < -10 || csx > W + 10) continue;
      var gy = HOR + 6 + Math.round(hashN(ci * 9.17) * 16);
      if (hashN(ci * 5.71) < 0.55){
        var cc = css(lerpC([44,108,58], [26,56,48], skyT));
        var ch = 8 + Math.round(hashN(ci * 7.7) * 6);
        rect(csx, gy - ch, 3, ch, cc);
        rect(csx - 3, gy - ch + 3, 2, 4, cc);
        rect(csx - 3, gy - ch + 3, 3, 2, cc);
        rect(csx + 3, gy - ch + 5, 2, 4, cc);
        rect(csx + 2, gy - ch + 5, 3, 2, cc);
      } else {
        var rc = css(lerpC([120,110,104], [60,52,60], skyT));
        rect(csx, gy - 3, 6, 3, rc);
        rect(csx + 1, gy - 5, 3, 2, rc);
      }
    }

    /* rider */
    var rx = Math.round(W * 0.30);
    var rgy = HOR + 30;
    var bob = S.burst > 0.03 ? Math.abs(Math.sin(fr * 0.5)) * 3 : Math.abs(Math.sin(fr * 0.1)) * 1;
    var ry = rgy - Math.round(bob);

    if (S.burst > 0.12 && dust.length < 60){
      for (var s = 0; s < 2; s++){
        dust.push({x: rx - 3, y: ry - 4, vx: -1 - Math.random() * 1.5, vy: -Math.random() * 1.2, life: 1, sz: 2 + Math.random() * 2});
      }
    }
    for (var di = dust.length - 1; di >= 0; di--){
      var p = dust[di];
      p.x += p.vx; p.y += p.vy; p.life -= dt * 1.4;
      if (p.life <= 0){ dust.splice(di, 1); continue; }
      g.globalAlpha = Math.max(0, p.life) * 0.7;
      g.fillStyle = css(lerpC([222,190,150], [160,120,120], skyT));
      var ps = Math.round(p.sz + (1 - p.life) * 3);
      g.fillRect(p.x | 0, p.y | 0, ps, ps);
    }
    g.globalAlpha = 1;
    drawRider(rx, ry);

    /* speed lines during ride burst */
    if (S.burst > 0.5){
      g.globalAlpha = 0.22;
      g.fillStyle = "#ffffff";
      for (var li = 0; li < 7; li++){
        var ly = (hashN(li * 13.7) * H + fr * 4) % H;
        g.fillRect(0, ly | 0, 24 + hashN(li * 3.3) * 36, 1);
      }
      g.globalAlpha = 1;
    }

    ctx.drawImage(buf, 0, 0, cv.width, cv.height);

    /* HUD sync */
    var dot = $("riderDot");
    if (dot) dot.style.bottom = (S.dispDist / 7000 * 100) + "%";
    var dr = $("distReadout");
    if (dr) dr.textContent = fmt(Math.round(S.dispDist)) + " m — " + zoneFor(S.dispDist).name;
  }

  function loop(t){
    var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    draw(dt);
    requestAnimationFrame(loop);
  }

  buildGauge();
  $("muteBtn").onclick = function(){
    S.muted = !S.muted;
    this.textContent = S.muted ? "SOUND: OFF" : "SOUND: ON";
    if (!S.muted) audioCtx();
  };
  showHome();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
